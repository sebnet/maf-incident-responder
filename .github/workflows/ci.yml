name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IncidentResponder.slnx

      - name: Build
        run: dotnet build IncidentResponder.slnx --no-restore -c Release

      # Deterministic tests only (fake IChatClient). No Azure, no model calls, no containers.
      - name: Test
        run: dotnet test --solution IncidentResponder.slnx --no-build -c Release
