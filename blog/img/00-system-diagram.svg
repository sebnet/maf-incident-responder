<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>

  <text x="40" y="62" font-size="30" font-weight="800" fill="#f8fafc">Incident Responder: the big picture</text>

  <!-- panels -->
  <g fill="#111c33" stroke="#334155" stroke-width="1.5">
    <rect x="40" y="110" width="500" height="510" rx="16"/>
    <rect x="600" y="110" width="260" height="510" rx="16"/>
    <rect x="920" y="110" width="320" height="510" rx="16"/>
    <rect x="1290" y="110" width="270" height="510" rx="16"/>
  </g>
  <g font-size="13" font-weight="700" letter-spacing="1.5">
    <text x="64" y="144" fill="#f87171">THE LAB · BREAKS ON PURPOSE</text>
    <text x="624" y="144" fill="#fbbf24">GRAFANA LGTM</text>
    <text x="944" y="144" fill="#38bdf8">RESPONDER · MAF</text>
    <text x="1314" y="144" fill="#4ade80">HUMAN IN THE LOOP</text>
  </g>

  <!-- lab -->
  <g font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <rect x="70" y="175" width="180" height="56" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="210">Load generator</text>
    <rect x="70" y="290" width="180" height="56" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="325">orders-api</text>
    <rect x="70" y="405" width="180" height="56" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="440">catalog-api</text>
    <rect x="320" y="290" width="170" height="56" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="405" y="325" fill="#cbd5e1">Postgres</text>
    <rect x="320" y="405" width="170" height="56" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="405" y="440" fill="#cbd5e1">Redis</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)">
    <line x1="160" y1="232" x2="160" y2="288"/>
    <line x1="160" y1="347" x2="160" y2="403"/>
    <line x1="252" y1="318" x2="318" y2="318"/>
    <line x1="252" y1="433" x2="318" y2="433"/>
  </g>
  <rect x="70" y="520" width="420" height="72" rx="12" fill="#2a1520" stroke="#f87171" stroke-width="1.5"/>
  <text x="280" y="550" font-size="17" font-weight="700" fill="#fecaca" text-anchor="middle">Fault injection</text>
  <text x="280" y="574" font-size="15" fill="#fca5a5" text-anchor="middle">errors · latency · pool exhaustion</text>

  <!-- telemetry -->
  <g text-anchor="middle">
    <rect x="630" y="185" width="200" height="96" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="730" y="226" font-size="22" font-weight="700" fill="#fde68a">Loki</text>
    <text x="730" y="256" font-size="16" fill="#cbd5e1">logs</text>
    <rect x="630" y="316" width="200" height="96" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="730" y="357" font-size="22" font-weight="700" fill="#fde68a">Prometheus</text>
    <text x="730" y="387" font-size="16" fill="#cbd5e1">metrics</text>
    <rect x="630" y="447" width="200" height="96" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="730" y="488" font-size="22" font-weight="700" fill="#fde68a">Tempo</text>
    <text x="730" y="518" font-size="16" fill="#cbd5e1">traces</text>
  </g>
  <line x1="542" y1="364" x2="598" y2="364" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="570" y="350" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">OTLP</text>

  <!-- responder -->
  <g text-anchor="middle">
    <rect x="950" y="185" width="260" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1080" y="238" font-size="26" font-weight="800" fill="#bae6fd">Agent</text>
    <text x="1080" y="270" font-size="16" fill="#cbd5e1">finds the root cause</text>
    <text x="1080" y="292" font-size="16" fill="#cbd5e1">proposes a fix</text>
    <rect x="950" y="380" width="260" height="84" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1080" y="418" font-size="19" font-weight="600" fill="#e2e8f0">Telemetry tools</text>
    <text x="1080" y="443" font-size="15" fill="#94a3b8">read-only</text>
  </g>
  <line x1="1080" y1="317" x2="1080" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M862 420 H948" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="905" y="406" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">query</text>
  <text x="1080" y="520" font-size="15" fill="#94a3b8" text-anchor="middle">Later phases add runbook RAG,</text>
  <text x="1080" y="542" font-size="15" fill="#94a3b8" text-anchor="middle">memory, workflows and a war room</text>

  <!-- human + postmortem -->
  <g text-anchor="middle">
    <rect x="1320" y="185" width="210" height="130" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="1425" y="238" font-size="24" font-weight="800" fill="#bbf7d0">On-call human</text>
    <text x="1425" y="274" font-size="16" fill="#cbd5e1">approve / reject / modify</text>
    <rect x="1320" y="400" width="210" height="130" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1425" y="453" font-size="24" font-weight="800" fill="#ddd6fe">Postmortem</text>
    <text x="1425" y="485" font-size="16" fill="#cbd5e1">written from the</text>
    <text x="1425" y="507" font-size="16" fill="#cbd5e1">incident record</text>
  </g>
  <line x1="1212" y1="250" x2="1318" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="1265" y="236" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">proposal</text>
  <line x1="1425" y1="317" x2="1425" y2="398" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="1440" y="364" font-size="14" font-weight="600" fill="#94a3b8">resolved</text>

  <!-- approved fix path back to the lab -->
  <path d="M1532 235 H1580 V720 H280 V594" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <rect x="640" y="702" width="520" height="36" rx="8" fill="#14172f"/>
  <text x="900" y="726" font-size="17" font-weight="700" fill="#86efac" text-anchor="middle">approved fix, applied to the lab only after a human says yes</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
